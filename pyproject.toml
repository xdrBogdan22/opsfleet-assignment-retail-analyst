[project]
name = "retail-analyst"
version = "0.1.0"
description = "Data analysis chat agent for retail executives"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "db-dtypes>=1.9.0",
    "google-cloud-bigquery>=3.47.0",
    "google-genai>=3.0.0",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
